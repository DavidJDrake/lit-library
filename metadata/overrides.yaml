# --- Weird Fiction the Lovecraft Circle by Project Gutenberg: first-publication years, title casing, Gutenberg summaries ---
02ccd67150dae898:
  description: '"Tales of Wonder" by Lord Dunsany is a collection of short stories written during the
    early 20th century, showcasing the author''s unique blend of fantasy and philosophical musings. The
    stories leverage rich imagery and whimsical narratives, inviting readers into a world where dreams
    intertwine with reality, ancient lore meets modernity, and the boundaries of imagination expand. The
    opening chapters introduce various characters and settings, hinting at themes of enchantment, storytelling,
    and the essence of existence in a fantastical lens.  The beginning of "Tales of Wonder" offers a glimpse
    into Dunsany''s imaginative storytelling style, beginning with a preface that reflects on the nature
    of dreams amid the tumult of war-torn Europe. The first tale, "A Tale of London," features a hasheesh-eater
    who dreams of a fantastical London, rich in beauty and art, drawing both the admiration and envy of
    a Sultan. Each subsequent story incorporates elements of the mundane and the extraordinary, delving
    into concepts of time, fate, and the human experience—each woven with lyrical prose and vivid descriptions.
    Moreover, stories like "Thirteen at Table" and "The City on Mallington Moor" promise captivating journeys
    through mysterious realms and exceptional encounters, setting the stage for a collection that celebrates
    the wondrous and surreal aspects of life.'
  title: Tales of Wonder
  year: 1916
03ac6225500c8056:
  description: '"Tales of War" by Lord Dunsany is a collection of short stories written during the early
    20th century, primarily around the time of World War I. The stories delve into the experiences of
    soldiers, specifically those from a village called Daleswood, capturing their camaraderie, fears,
    and reflections on home amid the backdrop of warfare.   The opening of the collection begins with
    "The Prayer of the Men of Daleswood," which follows a group of soldiers from their small village as
    they face the chaos of battle. With only a few men left behind to represent the village, the narrative
    explores their shared memories and a desire to preserve their homeland''s way of life amid the violence
    surrounding them. The soldiers decide that one of them should survive to tell the tale of Daleswood
    by carving their experiences into a chalk boulder, ensuring that the village''s essence is remembered.
    This poignant moment captures the deep connection they hold to their past, creating a significant
    emotional resonance as they confront the uncertainty of their fates.'
  title: Tales of War
  year: 1918
04537ecda4bd69f1:
  description: '"Skulls in the Stars" by Robert E. Howard is a novella that falls within the realm of
    horror and dark fantasy, likely written in the early 20th century. The story revolves around the mysterious
    and sinister happenings in an eerie setting, involving a haunted moor and a vengeful spirit. It captures
    the themes of bravery against dark forces, as the protagonist confronts supernatural evils.  The narrative
    follows Solomon Kane, a Puritan hero, as he embarks on a journey to Torkertown. Despite warnings from
    the villagers to avoid the treacherous moor road, Kane is drawn to face the terror that has claimed
    the lives of many. Upon his arrival, he encounters the remnants of a recent victim and learns that
    a demonic entity haunts the moors, killing indiscriminately. His investigation leads him to old Ezra,
    a miser linked to a ghostly avenger—Gideon, his insane cousin, whom he murdered. In the climax, Kane
    ensures the soul of Gideon is appeased by allowing his spirit to exact revenge on Ezra, intertwining
    fate, guilt, and the supernatural in a gripping tale of horror.'
  title: Skulls in the Stars
  year: 1929
052977a89fa86d78:
  description: '"The King of Elfland''s Daughter" by Lord Dunsany is a fantasy novel published in 1924.
    When the people of Erl demand a magic lord, Alveric is sent to Elfland to win the hand of Princess
    Lirazel. Their union brings a son, but the fairy bride struggles to fit into the mortal world. As
    Lirazel returns to her father''s enchanted realm, her lovesick husband embarks on a hopeless quest,
    while the Elf King contemplates extraordinary measures to reunite his daughter with those she loves.'
  title: The King of Elfland's Daughter
  year: 1924
059e46240d4e64da:
  description: '"The Secret Glory" by Arthur Machen is a novel written in the early 20th century. It explores
    themes of spiritual longing, ambition, and the clash between individual desires and societal expectations.
    The narrative centers on Ambrose Meyrick, a schoolboy navigating the harsh realities of public school
    life and his tumultuous relationship with authority figures, particularly his uncle, Mr. Horbury.  The
    opening of the novel introduces Ambrose Meyrick as he arrives late at the Old Grange after a solitary
    excursion to Selden Abbey, reflecting his deep interest in antiquity and the past. As he faces his
    uncle''s wrath for being tardy, we witness the oppressive environment of the school and Meyrick''s
    internal struggles. Mr. Horbury’s harsh disciplinary approach culminates in a severe punishment that
    dramatically impacts Meyrick''s psyche. This initial section sets the tone for the conflicts Ambrose
    will face, both externally with the rigid school culture and internally as he seeks to understand
    his identity and aspirations amidst the strategies and betrayals of adolescence.'
  title: The Secret Glory
  year: 1922
06390f0c3147657c:
  description: '"Don Rodriguez; Chronicles of Shadow Valley" by Lord Dunsany is a fantasy novel published
    in 1922. Set in a mythical golden age of Spain, this coming-of-age tale follows Rodriguez, a young
    man denied his family inheritance and sent forth to win his own estate and bride through skill with
    sword and mandolin. Accompanied by his servant Morano, Rodriguez embarks on extraordinary adventures
    that lead him deeper into the fantastical realm of Shadow Valley, where reality and myth intertwine.'
  title: 'Don Rodriguez: Chronicles of Shadow Valley'
  year: 1922
0682a5866fda346b:
  description: '"The Lost Race" by Robert E. Howard is a fantasy novella published in the early 20th century.
    This adventurous tale follows a Briton named Cororuc who becomes entangled in a conflict involving
    a mysterious ancient race of Picts following his encounter with bandits in an ominous forest. The
    narrative explores themes of survival, cultural conflict, and the lost histories of ancient peoples.  The
    story begins with Cororuc fleeing from the menacing bandit chief Buruc and his henchmen in a dark
    forest. After a fierce confrontation, he is captured by a tribe of small, dark-complexioned Picts
    who reveal their history of subjugation and resentment against the Celts. The ancient Pictish leader
    accuses Cororuc''s race of the downfall of their civilization and prepares to execute him as a symbolic
    act of vengeance. However, the intervention of a wolf who turns out to be a Pict in disguise saves
    Cororuc''s life and leads him to safety, revealing a complex history of conflict and camaraderie amid
    the remnants of a once-great race. Ultimately, Cororuc is given gifts and direction back to his people,
    shaping his journey between worlds so closely tied yet at odds with one another.'
  title: The Lost Race
  year: 1927
0926749bcb4b63b1:
  description: '"The Works of Edgar Allan Poe — Volume 4" by Edgar Allan Poe is a collection of literary
    pieces likely written in the mid-19th century. This volume contains a blend of short stories and essays,
    showcasing Poe''s mastery in exploring themes of horror, the supernatural, and human psychology, which
    is evident from the titles listed in the contents like "The Devil in the Belfry" and "The System of
    Doctor Tarr and Professor Fether."  The beginning of the volume introduces readers to "The Devil in
    the Belfry," where we are transported to the quaint Dutch borough of Vondervotteimittiss, characterized
    by its peculiar architecture and the strange behaviors of its inhabitants. The narrative humorously
    describes the monotonous lifestyle of the townsfolk, who are obsessed with their clocks and cabbages,
    until an odd little man arrives and disrupts their orderly existence. As the clock unexpectedly strikes
    thirteen, chaos ensues, showcasing Poe''s satirical take on societal norms and the nature of time.
    In this opening chapter, the grotesque blend of humor and horror sets the tone for the unique tales
    that follow in the collection.'
  title: The Works of Edgar Allan Poe, Volume 4
  year: 1903
0bc8a3c82cb0e0ff:
  description: '"The Wanderings and Homes of Manuscripts" by M. R. James is a scholarly historical account
    written in the early 20th century. The book discusses the journey and preservation of manuscripts
    throughout history, examining where they were produced, how they have been collected, and suggesting
    methods for studying their histories. It is primarily focused on Greek and Latin manuscripts, with
    an objective to arouse curiosity in readers about the continuing exploration of manuscript history.  At
    the start of this work, James outlines the significant role manuscripts play in preserving historical
    records and literary works. He specifically highlights manuscripts from the Eton College collection,
    providing detailed accounts of various volumes, their origins, and tracing their paths through history.
    James begins with a few select manuscripts, detailing their features and the circumstances of their
    acquisition, often interspersing the narrative with anecdotes and historical context that show how
    these texts have transcended time, ownership, and even geographical barriers. The opening sets a foundation
    for the broader exploration of manuscript provenance and the many stories embedded within their pages.'
  title: The Wanderings and Homes of Manuscripts
  year: 1919
0e6d1e4346ea3d57:
  description: '"Red Nails" by Robert E. Howard is a novella serialized in Weird Tales magazine from July
    to October 1936. It follows Conan the Cimmerian and warrior Valeria as they discover Xuchotl, a mysterious
    jade city enclosed by an emerald dome. The city''s remaining inhabitants are locked in a deadly blood
    feud that has consumed their civilization for generations. As Conan and Valeria become entangled in
    ancient rivalries, sorcery, and betrayal, they must navigate a decaying world where survival means
    confronting both human treachery and supernatural forces.'
  title: Red Nails
  year: 1936
114a9165872662f9:
  description: '"A Witch Shall Be Born" by Robert E. Howard is a sword and sorcery novella written in
    1934. When an evil twin witch replaces the rightful queen of Khauran, Conan the Cimmerian refuses
    to serve the impostor and faces brutal crucifixion for his defiance. The story follows Conan''s survival
    and quest for vengeance as the witch''s reign plunges the city into terror and ruin. Featuring one
    of the most memorable scenes in the Conan series, this tale explores themes of duality, paranoia,
    and the eternal conflict between barbarism and civilization.'
  title: A Witch Shall Be Born
  year: 1934
17fd7a2728c1ebc0:
  description: '"Can Such Things Be?" by Ambrose Bierce is a collection of supernatural tales written
    during the late 19th century. The stories delve into themes of death, the afterlife, and the intersection
    of reality with the paranormal, showcasing Bierce’s dark humor and philosophical musings on life and
    mortality. The opening story, "The Death of Halpin Frayser," introduces the titular character, who
    awakens in a forest, haunted by a sense of dread and memories intertwined with both the living and
    the spectral.  The beginning of the collection sets the tone with Halpin Frayser waking in a mysterious
    forest and uttering a name he barely remembers—Catherine Larue. His journey leads him into a nightmarish
    dream where he encounters blood and shadowy whispers, evoking a palpable sense of terror and guilt
    tied to a potential crime he cannot recall. As the narrative unfolds, Frayser confronts chilling apparitions,
    including a spectral vision of his mother, adding layers of familial tension and horror. Through vivid
    imagery and a brooding atmosphere, Bierce engages readers with a narrative that blurs the line between
    reality and the spectral realm, promising unsettling revelations as the tales progress.'
  title: Can Such Things Be?
  year: 1893
18e51fba915d3692:
  description: '"Episodes before thirty" by Algernon Blackwood is a memoir written in the early 20th century.
    It traces the author’s formative years through hardship, wanderlust, and spiritual seeking, from failed
    ventures in Canada and moral conflict over running a Toronto saloon to poverty and fear in New York,
    set against an evangelical upbringing and a growing devotion to Nature and Eastern thought.  The opening
    of the memoir recalls a stifling New York boarding-house where the young narrator endures vermin,
    hunger, and the menace of a petty forger roommate, cooks dried apples over gas jets, and sometimes
    sleeps on benches in Central Park. He then backtracks to his Canadian years: modest work at a Methodist
    magazine under kindly Dr. Withrow (who recoils when he admits he is a Buddhist), an ill-starred partnership
    in a Jersey dairy that collapses, and a second gamble—buying the disreputable Hub Hotel with his friend
    John Kay—despite a conscience formed by teetotal, evangelical parents. A flashy opening day at the
    saloon yields to decline, pilfering staff, and financial loss, even as he learns barroom tactics from
    Billy Bingham and wrestles with shame. Threaded through are vivid memories of evangelical childhood,
    Moravian schooling, early encounters with Patanjali, theosophy, and hypnotism, the guidance of a Hindu
    student, and, above all, nights alone in woods and by the lake whose rapture and calm teach detachment
    and help him endure.'
  title: Episodes Before Thirty
  year: 1923
1a88ce26ee843f8b:
  description: '"Fifty-One Tales" by Lord Dunsany is a collection of short stories written in the early
    20th century, specifically in the period around the 1910s. This book explores a variety of fantastical
    themes and mythological motifs, delving into the realms of imagination and the human condition. Dunsany''s
    work is characterized by its lyrical prose and rich imagery, reflecting a deep engagement with myth
    and the poetic tradition.  The stories within "Fifty-One Tales" are diverse, each presenting unique
    narratives that often intertwine the mundane with the extraordinary. For instance, tales like "The
    Assignation" paint a vivid portrait of the relationship between fame and artistry, while "Charon"
    reflects on mortality through a conversation between Charon and the last shade of a man. Other stories,
    such as "The Death of Pan," evoke the themes of loss and the passage of time, emphasizing Dunsany''s
    fascination with the fleeting nature of beauty and existence. Throughout the collection, the author
    employs a dreamlike quality, allowing readers to traverse imaginative landscapes populated by whimsical
    characters, symbolic events, and profound reflections on life, death, and creativity.'
  title: Fifty-One Tales
  year: 1915
1c5e7948a530af92:
  description: '"The Collected Works of Ambrose Bierce, Volume 02" by Ambrose Bierce is a collection of
    short stories and essays written during the late 19th century. The work is characterized by Bierce''s
    distinctive blend of dark humor, social commentary, and exploration of themes related to war, mortality,
    and the human condition. It features various tales, including the morally complex narratives of soldiers
    and civilians caught in the turmoil of the American Civil War.  The beginning of this volume opens
    with a preface from the author outlining the circumstances of its publication, highlighting its struggle
    for recognition and the support from a local merchant. The first story, "A Horseman in the Sky," introduces
    Carter Druse, a soldier who finds himself asleep at his post, ultimately leading to a morally fraught
    decision that represents the dilemmas faced by individuals during conflict. The opening sets the tone
    for Bierce''s exploration of duty, personal struggle, and the psychological effects of war, entwining
    vivid descriptions with a profound sense of irony and tragedy.'
  title: In the Midst of Life
  year: 1891
1da4f10c9a081268:
  description: '"Shadows in Zamboula" by Robert E. Howard is a Conan story first published in November
    1935. When Conan spends the night in a cheap tavern in the desert city of Zamboula, he discovers streets
    filled with roaming cannibals and deadly political intrigue. The barbarian hero must navigate treacherous
    innkeepers, a hypnotic high priest, and a formidable strangler while becoming entangled in a dangerous
    scheme involving a satrap''s mistress and her insane lover.'
  title: Shadows in Zamboula
  year: 1935
1de56c63758245af:
  description: '"Unhappy Far-Off Things" by Lord Dunsany is a collection of prose poems and reflective
    essays written in the early 20th century, specifically in the aftermath of World War I. The work draws
    attention to the tragic consequences of war, focusing on the deep suffering experienced by the people
    and places affected by the conflict, particularly in France. This poignant commentary on loss and
    devastation captures both the physical ruins and the emotional scars left behind by the atrocities
    of war.  In this evocative collection, Dunsany presents various scenes of destruction and melancholy,
    exploring the remnants of towns, gardens, and homes that once thrived but have now been laid waste.
    Through vivid imagery and careful reflection, he recounts encounters with desolate landscapes and
    individuals grappling with their profound losses. The narratives expose the harsh reality of civilization''s
    fragility in the face of conflict, and Dunsany''s poetic style enhances the emotional weight, allowing
    readers to feel the depth of despair alongside the fleeting beauty of nature reclaiming its domain
    over abandoned places. Ultimately, the book serves as a powerful tribute to the forgotten lives and
    stories overshadowed by the march of war.'
  title: Unhappy Far-Off Things
  year: 1919
1fefc6d91decab88:
  description: '"Plays of Near & Far" by Lord Dunsany is a collection of dramatic works written in the
    early 20th century. This anthology presents a blend of fantasy and allegory, showcasing Dunsany''s
    unique style, characterized by elaborate language and imaginative settings. The plays explore fantastical
    themes, often touching upon mythology, existential questions, and the nature of power through allegorical
    tales and rich characters.  The opening of the collection begins with a preface in which Dunsany explains
    his rationale for publishing his plays, despite traditionally allowing them to be judged by live audiences
    first. He offers insights into three specific plays: "The Compromise of the King of the Golden Isles,"
    "The Flight of the Queen," and "Cheezo." Each piece set the stage for thematic explorations of choice,
    destiny, and moral dilemmas, as exemplified by a king grappling with imperial edicts, a queen''s enchanting
    call to a mystical mountain, and the satirical commentary on societal values through the character
    of Sladder, who is deeply entrenched in materialism and superficial food marketing.'
  title: Plays of Near and Far
  year: 1922
204214a32e4cde9e:
  description: '"The Damned" by Algernon Blackwood is a novel written in the early 20th century, specifically
    in 1914. The story centers on the uneasy visit of the protagonist, Bill, to The Towers, the country
    estate of a banker’s widow, Mabel Franklyn, which brings him and his sister Frances into an atmosphere
    thick with discomfort and strange influences. As they settle into the mansion, a series of unsettling
    impressions begins to unfold, hinting at darker, emotional disturbances tied to the late Mr. Franklyn
    and the house itself.  The opening of "The Damned" establishes a tense relationship between Bill and
    Frances as they prepare for the visit to The Towers, where Frances hopes to provide companionship
    to their old friend, Mabel. As they arrive, a heavy atmosphere envelops them, and both siblings feel
    the weight of the house''s history, filled with an unexplainable dread. Throughout the beginning chapters,
    we see Bill struggle against restlessness while trying to write, overshadowed by the oppressive environment.
    Frances hints at her discomfort with sleeping alone in the house, further suggesting that the published
    portrait of Mr. Franklyn and the house''s design carry an oppressive weight. Their collective unease
    serves to create an ominous sense that something intangible yet menacing resides within the walls
    of The Towers, setting the stage for the unfolding mystery surrounding the influence of the deceased
    Franklyn and the hidden truths of the mansion''s past.'
  title: The Damned
  year: 1914
2584e27a1ef20766:
  description: '"The Education of Uncle Paul" by Algernon Blackwood is a novel written in the early 20th
    century. The story revolves around the main character, Paul Rivers, who is returning to England after
    two decades in America. Upon his arrival, the book delves into themes of childhood wonder, emotional
    repression, and contrasts between the freedom of nature and the constraints of civilization.  The
    opening portion introduces Paul Rivers aboard a ship as it approaches the English coast. He is filled
    with a mixture of excitement and nostalgia, reflecting on his past and the childhood emotions he has
    suppressed over the years. As he interacts with the other passengers, including an older man overcome
    with emotion at returning to his homeland, Paul''s internal conflict becomes evident—his profound
    love for nature and the simplicity of life contrasts sharply with his fears about conforming to the
    expectations of society. This complex relationship with his own emotions and the world suggests a
    deep exploration of personal identity and connection as he prepares to meet his sister and her children
    in the English countryside.'
  title: The Education of Uncle Paul
  year: 1909
2a1d4cd16555200e:
  description: '"The Works of Edgar Allan Poe — Volume 5" by Edgar Allan Poe is a collection of literary
    works, likely gathered during the mid-19th century. This volume includes a variety of essays, short
    stories, and poetry, showcasing Poe''s range in exploring macabre themes and philosophical musings,
    as well as his craft in conveying deep emotional experiences through language.   The opening portion
    of the volume features "Philosophy of Furniture," where Poe critiques and examines the aesthetics
    of home decor, reflecting on how cultural backgrounds influence taste and aesthetic judgment, particularly
    contrasting American and European styles. He details the importance of coherence and artistic arrangement
    in interior decoration, offering keen observations and critiques of various nations'' approaches to
    furnishing their homes. This analytical essay sets a tone that blends both satire and seriousness,
    creating a foundation for deeper explorations of human taste and ethics found throughout the volume.'
  title: The Works of Edgar Allan Poe, Volume 5
  year: 1903
2bc722ecae89308c:
  description: '"Pan''s garden" by Algernon Blackwood is a collection of short stories written in the
    early 20th century. The tales center on nature’s mysterious, often supernatural presence and its effect
    on human lives. The opening story follows retired forester David Bittacy, his devout wife Sophia,
    and a tree-obsessed painter, Sanderson, as the living force of the woods presses upon their Hampshire
    home.


    The opening of the collection presents Sanderson’s uncanny gift for capturing a tree’s “personality,”
    which resonates with David’s lifelong intimacy with forests and alarms Sophia’s pious caution. Long
    twilight talks about plant consciousness and a vast, collective forest “being” unsettle the household;
    a strange wave-like motion across the lawn and the wind “roaring further out” suggest the woods are
    aware—and held at bay only by their cedar. David later sleepwalks, murmuring that the forest has “sent
    for” him. After Sanderson leaves, storms break limbs from the cedar, the family builds a barrier along
    the garden’s edge, and David’s identification with the trees intensifies: he abandons their annual
    trip abroad, spends his days and nights in the Forest, and grows exultant while Sophia’s dread and
    protective vigilance deepen. The section closes with her failed attempts to medicalize the change
    and his invitation to visit a solitary beech at night, as the pressure of the woods steadily mounts.'
  title: 'Pan''s Garden: A Volume of Nature Stories'
  year: 1912
2ce61f3cf6bba827:
  description: '"Tales of Three Hemispheres" by Lord Dunsany is a collection of fantasy short stories
    published in 1919. This gathering of fourteen tales transports readers through mystical realms and
    strange encounters, from the exploits of Bwona Khubla to mysterious gods exacting vengeance. The collection
    culminates in three interconnected stories set "Beyond the Fields We Know," revisiting the exotic
    river Yann and introducing new wonders in forgotten streets and distant cities. Dunsany''s imaginative
    landscapes blend Eastern mystery with fantastical invention.'
  title: Tales of Three Hemispheres
  year: 1919
2d9ddba7aac90644:
  description: '"Skull-Face" by Robert E. Howard is a work of fiction written in the late 1920s and falls
    within the genre of weird and horror tales. The narrative introduces Stephen Costigan, an American
    hashish addict who becomes entwined in a dark web of drug use, visions, and sinister characters. Throughout
    the story, the presence of a chilling and enigmatic antagonist, known as the Skull-Faced Man, looms
    large, suggesting themes of addiction and moral decline amidst a backdrop of tension between Eastern
    mystique and Western civilization.  The opening portion of the story illustrates Costigan''s haunting
    dreams influenced by hashish, leading him into encounters with fantastical and horrific imagery, including
    the Skull-Faced Man and a beautiful girl named Zuleika. As he struggles with his addiction and the
    surreal experiences that come with it, he finds himself drawn into a world of opium dens, danger,
    and malevolent forces. His gradual awakening to the reality of his situation hints at deeper plots
    involving drug trafficking and a powerful, shadowy figure who seeks to manipulate him. The narrative
    explores themes of despair, the consequences of addiction, and a burgeoning mysterious plot that promises
    danger and intrigue.'
  title: Skull-Face
  year: 1929
2da044c96c3a8907:
  description: '"The Centaur" by Algernon Blackwood is a novel written in the early 20th century. The
    story revolves around Terence O''Malley, a complex and contemplative man grappling with his place
    in a modern world that he finds stifling and disconnected from nature. As the narrative unfolds, O''Malley''s
    longing for both wilderness and authentic connection leads him to encounter a mysterious father and
    son on a ship, who evoke a deep sense of understanding and emotion within him.  At the start of the
    book, the protagonist, O''Malley, observes the phenomenon of profound personalities that captivate
    interest and inspire curiosity in those around them. Upon encountering a large man and his son aboard
    a steamer heading for the Levant, O''Malley feels an instantaneous connection marked by a shared sense
    of unfamiliarity and a yearning for escape from modern civilization''s constraints. This poignant
    opening delves into O''Malley’s introspection about the loneliness that exists in modern life and
    hints at a deeper, spiritual connection with the natural world, setting the stage for further exploration
    of identity, intuition, and the search for belonging throughout the novel.'
  title: The Centaur
  year: 1911
2fc5524aadf7dfb3:
  description: '"The Devil in Iron" by Robert E. Howard is a sword and sorcery story first published in
    August 1934. When a greedy fisherman accidentally awakens an ancient demon named Khosatral Khel on
    a remote island, a cyclopean fortress rises from the ruins. Meanwhile, Conan the Cimmerian is lured
    into a trap on the same island by an evil Turanian governor. Conan must battle mercenaries, giant
    serpents, and the iron-fleshed demon himself in this tale of resurrection and survival.'
  title: The Devil in Iron
  year: 1934
345097062b0b5b5b:
  description: '"The Night Land" by William Hope Hodgson is a horror and fantasy novel published in 1912.
    Set millions of years in the future after the Sun has died, the story depicts the last remnants of
    humanity sheltering in a colossal pyramid called the Last Redoubt. Surrounded by eternal darkness
    and besieged by mysterious forces and monstrous Watchers, they survive on dwindling energy. When the
    narrator makes psychic contact with a woman in a distant refuge, he ventures alone into the hostile
    night to find her—and his reincarnated lost love.'
  title: The Night Land
  year: 1912
3616ded3fa6923d1:
  description: '"The Hyena" by Robert E. Howard is a short story written during the early 20th century,
    specifically in the 1920s. This work vividly portrays the clash between colonial sensibilities and
    the mysterious elements of African culture, intertwined with themes of fear, power, and instinctual
    rivalry. The story navigates the protagonist''s complex emotions and experiences as he encounters
    the enigmatic fetish-man Senecoza and contemplates the sinister legends surrounding him.  The narrative
    follows Steve, a young man new to Africa, who finds himself drawn into a web of intrigue and danger
    surrounding Senecoza, a powerful figure among the natives. As Steve grapples with his feelings of
    jealousy, fear, and admiration for the fetish-man, he becomes increasingly aware of a lurking menace.
    His struggle intensifies when he meets Ellen, a woman whose presence fascinates him, but also incites
    the wrath of Senecoza. When Ellen is captured, Steve''s desperation drives him to confront both the
    fetish-man and the primal forces symbolized by the hyenas that haunt the African landscape. The climax
    reveals a chilling connection between Senecoza, the mystical wildlife, and the savage realities of
    power and fear, culminating in a mysterious resolution that leaves an air of horror and ambiguity.'
  title: The Hyena
  year: 1928
3671f2fd7ae3e13d:
  description: '"John Silence, Physician Extraordinary" by Algernon Blackwood is a collection of supernatural
    tales written in the early 20th century. The narrative revolves around Dr. John Silence, a unique
    physician who specializes in psychical afflictions and offers his unconventional healing methods to
    those suffering from mysterious emotional states. His cases often involve elements of the occult,
    exploring the deeper realms of the human psyche and the supernatural.  The opening portion introduces
    Dr. Silence as he engages in a conversation with a Swedish lady, Mrs. Sivendson, regarding a case
    that intrigues him—a young author named Felix Pender, who has suddenly lost his sense of humor and
    is plagued by an inexplicable terror. The doctor learns about Pender''s haunting experiences, which
    began after an experiment with a drug that has connected him with dark, psychical forces. This leads
    Silence to the conclusion that he must investigate this curious affliction further, setting the stage
    for a deeper exploration into psychical invasions and the potential dangers that lurk beyond the veil
    of ordinary perception.'
  title: John Silence, Physician Extraordinary
  year: 1908
36a9bfe046e89537:
  description: '"A Thin Ghost and Others" by M. R. James is a horror short story collection published
    in 1919. This third collection from the British master of supernatural fiction features five tales,
    several representing what critics call James'' "puzzle-story phase"—oblique narratives demanding careful
    interpretation. The stories range from mysterious disappearances to sinister cathedral secrets, with
    one tale serving as a companion piece to an earlier work featuring a similar creature. These atmospheric
    ghost stories showcase James'' distinctive style of understated terror.'
  title: A Thin Ghost and Others
  year: 1919
37200359ab9f30a9:
  description: '"The Gods of Pegāna" by Lord Dunsany is a fantasy book published in 1905. This debut work
    presents a mythological universe centered on an invented pantheon of deities dwelling in Pegāna. Through
    interconnected short stories, Dunsany introduces Māna-Yood-Susha̅i̅, the supreme creator who sleeps
    while his drummer Skarl maintains eternal rhythm, and various "small gods" who govern life, death,
    time, and destiny. The book attempts to account for fundamental elements like the ocean and moon through
    original mythology, illustrated by Sidney Sime''s artwork.'
  title: The Gods of Pegāna
  year: 1905
39832fe6884d04a1:
  description: '"Selections from the Writings of Lord Dunsany" by Lord Dunsany is a collection of imaginative
    tales and plays written in the early 20th century. This anthology showcases Dunsany''s unique blend
    of fantasy, mythology, and poetic prose, often steeped in themes of the ephemeral nature of beauty,
    the passage of time, and the influence of the divine. The works included exemplify his rich imagination,
    exploring fantastical realms, gods, and the human experience through allegorical narratives.  The
    opening portion introduces the tone and depth of Dunsany''s writing through various thematic threads.
    It begins with an introduction by W.B. Yeats, who reflects on the cultural changes in Ireland and
    Dunsany''s role in presenting a new, imaginative spirit through his fables. This segment hints at
    the philosophical undercurrents within Dunsany''s works, such as the interplay between humanity and
    the divine, as seen in excerpts like "The Gods of the Mountain." In this initial act, three beggars
    engage in discussions about the drowsy state of the gods and their own plight, suggesting a larger
    commentary on the socio-spiritual conditions of their world. As the narrative unfolds, it sets the
    stage for the intricate fables and plays that delve into fundamental questions of existence, identity,
    and the ceaseless march of time.'
  title: Selections from the Writings of Lord Dunsany
  year: 1912
3abbfe5bcc6ef4e5:
  description: '"A Dreamer''s Tales" by Lord Dunsany is a collection of fantasy short stories published
    in 1910. This fourth book by the Irish fantasy writer features sixteen tales of mysterious cities,
    ancient prophecies, and strange encounters. Stories range from a mountain that claims all who climb
    it, to abandoned cities with lost souls, to objects telling their life histories. The collection showcases
    Dunsany''s imaginative worlds and mythic storytelling style that would influence writers like Tolkien,
    Lovecraft, and Le Guin.'
  title: A Dreamer's Tales
  year: 1910
3c90a11352ac8664:
  description: '"Old Testament Legends" by M. R. James is a collection of apocryphal stories drawn from
    lesser-known books of the Old Testament, written in the early 20th century. This work delves into
    the narratives surrounding biblical figures such as Adam, Abraham, and others, exploring their lives
    and events in a creative and mythical reinterpretation. The collection brings to life tales that expand
    on the canonical stories found in the Bible, offering readers new insights into these ancient characters
    and their relationships with God."  "At the start of the book, the author discusses the concept of
    apocryphal texts, explaining their role in Jewish and early Christian traditions. He highlights stories
    that exist outside the canonical Scriptures, such as those derived from the "Conflict of Adam and
    Eve" and the "Revelation of Moses," revealing events like Adam and Eve''s hardships after their expulsion
    from Eden and their encounters with Satan. James sets up a framework for the book by noting the importance
    of these legends and outlining themes of repentance, faith, and divine interaction characteristic
    of these early narratives."'
  title: Old Testament Legends
  year: 1913
3f83245533daad75:
  description: '"The Sword of Welleran and Other Stories" by Lord Dunsany is a collection of short stories
    published in 1908. This groundbreaking fantasy work marks Dunsany''s shift from mythological tales
    to heroic adventures in a more modern style. The twelve stories blend strange imagination with beautiful
    prose, featuring legendary warriors, enchanted fortresses, and supernatural encounters. A major influence
    on Tolkien, Lovecraft, and the sword and sorcery genre, this collection showcases what critics consider
    some of Dunsany''s finest work—stories that captivate with their otherworldly charm.'
  title: The Sword of Welleran and Other Stories
  year: 1908
4c0e7b21b84959bb:
  description: '"The Works of Edgar Allan Poe — Volume 2" by Edgar Allan Poe is a collection of literary
    works, including short stories and essays, written during the early to mid-19th century. This volume
    contains a range of tales that delve into themes of mystery, horror, and the uncanny, showcasing Poe''s
    mastery of suspenseful and psychological storytelling. Notable pieces include "The Purloined Letter,"
    which features the brilliant detective C. Auguste Dupin as he solves a complex crime involving a stolen
    letter of great importance, highlighting both the ingenuity of the detective and the folly of the
    authorities.  The opening of the volume features "The Purloined Letter," where the narrator and Dupin
    engage in deep contemplation over previous mysteries when they are visited by Monsieur G, the Prefect
    of the Parisian police. The Prefect brings details of a perplexing case involving a missing letter
    that holds significant political power, stolen by the Minister D. As the Prefect describes his failed
    attempts to recover the letter, Dupin''s insights reveal that the straightforward nature of the theft
    has eluded the authorities. The narrative sets a tone of intellectual intrigue as Dupin prepares to
    outsmart both the Prefect and the clever Minister, emphasizing Poe’s exploration of human intellect
    and the nature of perception.'
  title: The Works of Edgar Allan Poe, Volume 2
  year: 1903
4eaf3c401610b623:
  description: '"The Man Whom the Trees Loved" by Algernon Blackwood is a supernatural novella written
    during the early 20th century. The story centers around David Bittacy, an aging man with a profound
    connection to trees and nature, as well as his wife Sophia, who struggles to understand and accept
    this passion. David''s perception of the trees as sentient beings evolves into a deeper, almost mystical
    bond that creates tension within their marriage.  The opening of the novella introduces David Bittacy''s
    unique talent for capturing the essence of trees in his art. His ability to make each tree seem alive
    is both admired and questioned by those around him, particularly his wife, who fears the deepening
    connection he has to the woods. As the narrative unfolds, the dichotomy between the couple''s different
    perspectives on nature is established—David experiences the beauty and life within it, while Sophia
    battles her apprehensions and religious fears regarding the woods, which she associates with danger
    and the unknown. The tension between David''s longing for communion with the trees and Sophia''s anxiety
    creates a compelling dynamic as the story progresses toward supernatural implications surrounding
    their relationship with nature.'
  title: The Man Whom the Trees Loved
  year: 1912
4f6f519e1c24cb0c:
  description: '"Black Hound of Death" by Robert E. Howard is a dark horror tale written in the early
    20th century. This gripping short story delves into themes of vengeance, brutality, and the supernatural,
    exploring the terrifying transformation of a man into a beastly figure linked to ancient horrors.
    The narrative unfolds in the American South, amidst the eerie atmosphere of dense pinelands.  The
    story follows Kirby Garfield, who embarks on a mission to warn Richard Brent of a dangerous escaped
    convict, Tope Braxton, and an even more ominous threat, Adam Grimm. As Garfield navigates the dark
    wilderness, he encounters grisly murders, horrifying creatures, and an atmosphere steeped in dread.
    The tale culminates in a horrifying confrontation where it is revealed that Adam Grimm, once a human,
    has been transformed into a monstrous figure—a "werewolf" of sorts, driven by revenge against Brent
    for a past betrayal. The chilling narrative pulls the reader into a world filled with primal fear,
    violence, and the consequences of unchecked malevolence.'
  title: Black Hound of Death
  year: 1936
4ffd738d1967770b:
  description: '"Dig Me No Grave" by Robert E. Howard is a short horror story written in the early 20th
    century. The narrative delves into themes of dark magic, evil legacies, and the occult, centering
    on the eerie events following the death of a man named John Grimlan. It weaves elements of supernatural
    horror and psychological dread, making it a compelling tale for fans of gothic fiction.  The story
    unfolds as Kirowan and his friend John Conrad receive unsettling news about the death of the reclusive
    and sinister John Grimlan. Conrad is tasked with fulfilling Grimlan''s bizarre last wishes, which
    include an arcane ritual involving black candles and an ancient incantation. As they navigate Grimlan’s
    dark house filled with ominous markings and forgotten secrets, they encounter a mysterious oriental
    figure and experience a terrifying ritual that culminates in the supernatural and unexplainable. Ultimately,
    they witness a climactic horror that suggests Grimlan''s long-cultivated ties to dark forces lead
    to a chilling and inevitable conclusion, leaving them to grapple with the horrors unleashed by his
    legacy.'
  title: Dig Me No Grave
  year: 1937
5458be7822e17264:
  description: '"Ghost Stories of an Antiquary Part 2: More Ghost Stories" by M. R. James is a collection
    of eerie tales written during the early 20th century. This work is a continuation of the first part,
    showcasing more chilling ghost stories that explore themes of the supernatural, folklore, and unsettling
    events typically set in antiquarian contexts. Readers can expect to encounter a variety of spooky
    narratives, each laced with a sense of history, mystery, and a touch of psychological terror.  At
    the start of this volume, the opening story, "A School Story," introduces two men reminiscing about
    haunting memories from their schooldays, leading to a tale of an unsettling experience involving a
    ghostly figure and a mysterious teacher named Mr. Sampson. The narrator recalls a strange incident
    that consists of cryptic Latin phrases and omens that foreshadow eerie events surrounding their school.
    This story establishes the tone for the rest of the collection, weaving in elements of nostalgia,
    childhood fear, and the unknown which underpin the ghostly encounters.'
  title: More Ghost Stories of an Antiquary
  year: 1911
5c48453e58085423:
  description: '"The Hill of Dreams" by Arthur Machen is a semi-autobiographical novel written between
    1895 and 1897. It follows Lucian Taylor, a young man who experiences strange, sensual visions at an
    ancient Roman fort in rural Wales. Moving to London, he struggles in poverty while pursuing his dreams
    of becoming a writer. The novel explores the figure of the doomed artist, caught between mystical
    imaginings and harsh reality, blending decadent aestheticism with Machen''s own spiritual preoccupations.'
  title: The Hill of Dreams
  year: 1907
5f2b2a6c7db1c75e:
  description: '"The Book of Wonder" by Lord Dunsany is a fantasy short story collection published in
    1912. This unique work features fourteen tales written to accompany illustrations by Sidney Sime,
    who drew the pictures first. The stories transport readers to Dunsany''s elementary yet terrible fantasy
    world, filled with jewel thieves, idolators, dragons, and mysterious creatures called gnoles. These
    tales influenced legendary writers like Tolkien and Lovecraft, showcasing Dunsany''s imaginative storytelling
    that bridges the fantastical with psychological complexity and connections to the real world.'
  title: The Book of Wonder
  year: 1912
5f6d4ee77581c66d:
  description: '"The Empty House and Other Ghost Stories" by Algernon Blackwood is a collection of supernatural
    tales written in the early 20th century. The stories delve into eerie encounters, often exploring
    themes of fear, the uncanny, and the unknown, as they bring to life the unsettling experiences of
    characters who confront malevolent forces and haunted spaces. Each tale uniquely intertwines psychological
    and emotional turmoil with the spectral and strange.  At the start of the titular story, the protagonist,
    Jim Shorthouse, is summoned by his Aunt Julia to investigate a reputedly haunted house in their town.
    Intrigued yet hesitant, Shorthouse discovers that his aunt has acquired the keys for a weekend visit
    to explore the mysteries held within the house’s walls. They soon learn of a dark history involving
    a murder, which adds urgency and tension to their adventure. As they delve deeper into the house,
    strange occurrences and mounting dread manifest, testing their resolve and revealing the house''s
    sinister presence. The opening sets the stage for an exploration of fear and the supernatural, beckoning
    readers to join Shorthouse and his aunt in their unnerving quest.'
  title: The Empty House and Other Ghost Stories
  year: 1906
5fb7f4e8ff387f3c:
  description: '"Rattle of Bones" by Robert E. Howard is a short story written in the early 20th century,
    specifically during the 1920s. This tale falls into the genre of horror-fantasy and features themes
    of vengeance and the supernatural. The story is set in a dark and foreboding tavern located in a mysterious
    forest, where the eerie atmosphere sets the stage for a confrontation with fate and retribution.  In
    the narrative, two travelers, Solomon Kane and Gaston l''Armon, find themselves at the ominously named
    Cleft Skull Tavern, where they sense an unsettling tension. The story escalates as Kane discovers
    a hidden room containing a skeleton shackled to the floor, and soon, the treachery of his companion,
    Gaston, is revealed. The tale takes a dark turn when the tavern''s host, a man driven to madness by
    his past and the horrors he inflicted upon others, attempts to kill Kane. However, the dead magician''s
    bones, freed by Gaston, come back to claim vengeance. The climax reveals a macabre twist as the skeleton
    takes its final revenge on the twisted host, blending elements of supernatural horror with the harsh
    realities of human cruelty.'
  title: Rattle of Bones
  year: 1929
6044e3957ab9bf46:
  description: '"The Haunter of the Ring" by Robert E. Howard is a short story published in 1934. When
    Evelyn Gordon inexplicably tries to murder her new husband three times without remembering, investigator
    John Kirowan suspects more than reincarnated vengeance. A mysterious copper serpent ring—a cursed
    relic from ancient Stygia—holds the key. Kirowan discovers that a dark elemental spirit has been summoned
    to possess Evelyn, but the sorcerer who conjured it may have made a fatal miscalculation about payment.'
  title: The Haunter of the Ring
  year: 1934
658fff502a5fc3f3:
  description: '"The People of the Black Circle" by Robert E. Howard is a novella published in three parts
    in Weird Tales magazine in 1934. Set in a mythical prehistoric India, the story follows Conan as he
    kidnaps Princess Yasmina while battling the sinister Black Seers of Yimsha who plot world conquest.
    This tale of sorcery, political intrigue, and forbidden attraction is considered a classic of Conan
    lore, praised for its epic scope, Hindustan flavor, and deeper exploration of magic beyond typical
    sword-and-sorcery conventions.'
  title: The People of the Black Circle
  year: 1934
6cf3b8d193fdb2ab:
  description: 'Kings of the night by Robert E. Howard is a fantasy short story written in the early 20th
    century. Set in ancient Caledon, it blends heroic warfare with sorcery as Picts, Gaels, and Britons
    face a Roman incursion. The likely topic is a desperate, time-bending alliance forged to repel Rome,
    probing the burdens of kingship and the eerie nearness of past and future.


    Bran Mak Morn, king of the Picts, must unite fractious tribes and a sullen band of Northmen to ambush
    a Roman force. His wizard Gonar, using a primal jewel, draws Kull of Atlantis out of the distant past;
    Kull proves his right to lead by defeating the Northman Wulfhere in single combat. With Kull and three
    hundred vikings holding a narrow gorge, Bran arrays Pict archers along the slopes, Briton chariots
    beyond one ridge, and Cormac of Connacht’s Gaelic horse behind the other. The Romans under Marcus
    Sulius drive into the pass, only to be trapped as arrows darken the valley, chariots scythe their
    ranks, and Gaels smash their flanks. The Northmen die to a man, buying the time needed to collapse
    the legion, while Bran kills Sulius and the tribes win a brutal victory. At the height of the fighting,
    Kull, bloodied and unbowed, vanishes like a vision, returning to his age. In the quiet after, Bran
    grieves the cost of victory and Gonar muses that time and life are woven of dreams, even as a free
    Pictish nation is born from the slaughter.'
  title: Kings of the Night
  year: 1930
6f183df0da08833f:
  description: '"The Wolves of God, and Other Fey Stories" by Algernon Blackwood and Wilfred Wilson is
    a collection of short stories written in the early 20th century. The stories explore themes of nature,
    folklore, and the supernatural, often weaving elements of horror and mysticism into their narratives.
    The opening story, "The Wolves of God," centers on Jim Peace, a man returning to his homeland in the
    Orkneys after spending thirty years in the Canadian wilderness, where he confronts both fond memories
    and deep anxieties.  At the start of the tale, Jim arrives at the familiar yet haunting landscape
    of Sanday, filled with conflicting emotions as he reconnects with his brother Tom. Their reunion stirs
    complexities underlying Jim''s silence and unease, hinting at a deeper terror that haunts him from
    his time in the wild. Throughout their drive home to the old farm, an impending sense of dread builds,
    especially highlighted by Jim''s reaction to natural sounds he encounters, such as the barking of
    a dog, which stirs memories of the “Wolves of God.” As the story progresses, Jim''s fear escalates,
    culminating in a haunting revelation about the terrifying sacrifice he made in the wilderness, suggesting
    themes of existential horror and the lasting effects of isolation.'
  title: The Wolves of God, and Other Fey Stories
  year: 1921
732d53073e77550e:
  description: '"The Garden of Survival" by Algernon Blackwood is a novel likely written in the early
    20th century. This work explores themes of love, loss, and spiritual connection, particularly through
    the eyes of a man reflecting on his life and his relationship with a deceased wife, Marion. The narrator
    grapples with his feelings of both physical and emotional connection, questioning the essence of true
    love and the intricacies of human emotions.  At the start of the narrative, the unnamed narrator addresses
    an unknown confidant, sharing his complex feelings about his past marriage to Marion, whom he believes
    he had married out of pity rather than true love. He recounts deeply personal memories of their relationship,
    highlighting Marion''s beauty, her passion for music, and his own struggles to comprehend his feelings
    for her. The opening portion of the book sets the tone for a profound exploration of self-awareness,
    love, and the necessity for human connection as the narrator navigates between remorse for his past
    actions and a yearning for a deeper understanding of love—a journey that appears to intertwine with
    themes of survival in both physical and emotional senses.'
  title: The Garden of Survival
  year: 1918
740e2a13e995721c:
  description: '"Hieroglyphics" by Arthur Machen is a collection of literary reflections written in the
    early 20th century. The text is framed as a series of conversations that explore the nature of literature
    and the essence of fine writing through the musings of an enigmatic character referred to as "the
    Hermit." The work delves into profound themes regarding art, literature, and the human experience.  The
    opening portion of "Hieroglyphics" introduces the narrator''s friendship with the Hermit, a reclusive
    figure who engages in deep philosophical discussions about life and literature. Their meetings occur
    in a dim, atmospheric room filled with an air of mystique, emphasizing the solitude that the Hermit
    has chosen. The initial conversation revolves around the significance of journalism and literature,
    pondering the criteria that determine what constitutes true literary value. The Hermit''s belief in
    the concept of "ecstasy" as a hallmark of fine literature leads to inquiries about the relationship
    between art and commercialism, ultimately establishing a foundation for the book’s exploration of
    the higher ideals of literary expression.'
  title: Hieroglyphics
  year: 1902
762d820d6d560dbf:
  description: '"The Bright Messenger" by Algernon Blackwood is a novel written in the early 20th century.
    The story centers on Edward Fillery, a detached yet deeply sympathetic psychologist and doctor, who
    grapples with his identity shaped by his unconventional birth and upbringing. The book explores themes
    of human nature, consciousness, and the search for deeper understanding, particularly as it relates
    to a mysterious young man named LeVallon, who embodies both extraordinary abilities and a primordial
    connection to nature.  At the start of the narrative, we are introduced to Edward Fillery, who reflects
    on his unique perspective on life stemming from the complex circumstances of his birth. The opening
    chapters delve into his upbringing, his father''s passion for a foreign woman, and the psychological
    burdens that shaped him into a compassionate observer of humanity. As Fillery embarks on a journey
    to discover the potential of human consciousness, he receives a letter about LeVallon, a young man
    with unusual traits and a deep spiritual connection to nature. This letter hints at LeVallon being
    a unique case filled with potential for insight into the reality beyond ordinary human existence.
    The initial dynamics between Fillery, LeVallon, and the influences of their respective pasts set the
    stage for a deeper exploration of what it means to be human.'
  title: The Bright Messenger
  year: 1921
7684db9e3ff6d896:
  description: '"The Shadow Kingdom" by Robert E. Howard is a fantasy novelette first published in August
    1929. When Kull, a barbarian from Atlantis, conquers the ancient kingdom of Valusia and claims its
    throne, he discovers something far more dangerous than rival warriors. An alliance with the mysterious
    Brule the Spear-Slayer reveals a terrifying conspiracy: serpent-like beings lurk in the shadows, using
    magic to steal identities and rule from behind masks of deception. Kull must question everything—including
    his own reality.'
  title: The Shadow Kingdom
  year: 1929
78a39291f1b9cd14:
  description: '"Three John Silence Stories" by Algernon Blackwood is a collection of supernatural fiction
    written in the early 20th century. This volume features the eccentric Dr. John Silence, a psychic
    doctor with an extraordinary understanding of the human spirit and its afflictions. The stories delve
    into the realms of the unknown and the occurrences of psychical invasions, exploring how Dr. Silence
    employs his unique talents to help those afflicted by unexplainable phenomena.  The opening of "A
    Psychical Invasion," the first story in the collection, introduces Dr. John Silence as he converses
    with a Swedish lady named Mrs. Sivendson, who seeks his assistance with a peculiar case involving
    a humorist, Felix Pender. Pender, once a talented writer of comedies, has suddenly lost his gift for
    humor and is plagued by an overwhelming sense of fear that he cannot articulate. As Mrs. Sivendson
    recounts Pender''s strange experiences, Silence learns that the author believes a malevolent presence
    is haunting him, stifling his creativity and replacing his joy with dread. Intrigued, Dr. Silence
    prepares to meet Pender and investigate the source of this psychological turmoil, setting the stage
    for a remarkable exploration of psychic disturbances and the unseen forces at play in our lives.'
  title: Three John Silence Stories
  year: 1908
7af1b65ed8188aaa:
  description: '"Jewels of Gwahlur" by Robert E. Howard is a short story first published in 1935. Set
    in Howard''s fictional Hyborian Age, the tale follows Conan the Cimmerian as he ventures into the
    mythical African kingdom of Keshan, seeking legendary jewels hidden in an ancient city. Multiple treasure
    hunters converge on Alkmeenon, where a mummified oracle guards the riches. Conan must navigate supernatural
    mysteries, rival thieves, political intrigue, and deadly guardians in his quest for the fabled Teeth
    of Gwahlur.'
  title: Jewels of Gwahlur
  year: 1935
823d68f4094b0e27:
  description: '"Ten Minute Stories" by Algernon Blackwood is a collection of short stories written in
    the early 20th century. The stories explore varied themes, often delving into the supernatural, the
    strange, or psychological aspects of human experience. Each tale is designed to be a quick read, making
    them perfect for a brief escape into the intriguing worlds Blackwood creates.  The opening of the
    first story, "Accessory Before the Fact," introduces us to Martin, an accountant on holiday. He finds
    himself confused at a moorland crossroads due to an outdated map, leading to feelings of unease. As
    dusk falls, he encounters a suspicious pair of tramps who communicate with him in German, heightening
    his sense of dread. After a sudden, violent encounter, Martin realizes that he has been unintentionally
    eavesdropping on a dangerous situation that threatens others and wrestles with the moral implications
    of his knowledge. The story establishes a rich atmosphere of suspense and psychological depth, setting
    the tone for the intriguing narratives that follow in the collection.'
  title: Ten Minute Stories
  year: 1914
8309d572ffa4a5ac:
  description: '"Incredible Adventures" by Algernon Blackwood is a collection of short stories written
    in the early 20th century. The book explores themes of vitality, elemental forces, and the human connection
    to nature through diverse, fantastical tales. The opening story features John Hendricks, a tutor who
    embarks on a transformative journey around the world with Lord Ernie, a seemingly listless young nobleman,
    in an effort to inspire him.  The opening of the book introduces John Hendricks, who, having abandoned
    a path in the Church, becomes the tutor to Lord Ernie, the son of a prominent family. As they travel
    through various locales, Hendricks becomes increasingly frustrated with Ernie''s feeble disposition
    and lack of passion for life, which he perceives as a failure of their educational journey. The narrative
    focuses on their trip to the Jura mountains, where Hendricks hopes to rekindle some desire for life
    in his charge, especially as he recalls the influential presence of a local pastor, Leysin, from his
    youth. A sudden, powerful storm serves as a backdrop for the developing story, hinting at the awakening
    energy within Lord Ernie and setting the stage for the mystical experiences to follow.'
  title: Incredible Adventures
  year: 1914
840969753da31c3e:
  description: '"Jimbo: A Fantasy" by Algernon Blackwood is a novel written in the early 20th century.
    The story follows a young boy named Jimbo, who is intensely creative and imaginative but faces challenges
    in a world that often dismisses his thoughts. As he grapples with the depth of his imagination during
    interactions with his family and a governess, Jimbo''s life takes a turn as he finds himself entangled
    in a mysterious adventure related to an ominous, empty house near his home.  At the start of the narrative,
    Jimbo is introduced through his family dynamics and his father''s misconceptions about childhood imagination.
    While his siblings engage in fun games, he prefers to retreat into his thoughts and creations, which
    are threatened by a governess who is meant to "knock the nonsense out" of him. When she ultimately
    frightens him into believing that the empty house nearby is inhabited by malevolent entities, Jimbo''s
    vibrant imagination turns dark, leading him into a state of fear and captivity. This opening sequence
    sets the stage for Jimbo''s further adventures as he navigates the thin line between reality and fantasy
    in a potentially dangerous setting.'
  title: 'Jimbo: A Fantasy'
  year: 1909
844dcec6202a4610:
  description: '"The House of Souls" by Arthur Machen is a collection of short stories first published
    in the early 20th century. The compendium is characterized by Machen''s exploration of supernatural
    themes and the intersections between the mundane and the mystical. The stories delve into the mysterious
    aspects of life, often revealing an unseen world lying just beneath the surface of everyday existence.  The
    opening portion of "A Fragment of Life" introduces Edward Darnell, who awakens from a dream reminiscent
    of an ancient woods, only to face the routine of his daily life with his wife, Mary. As they discuss
    the lodestar of his wish to furnish their spare room with a modest amount of money, their conversation
    reveals hints of their backgrounds, aspirations, and the mundane tensions of suburbia. This sets the
    stage for deeper reflections on human experience, identity, and perhaps a yearning for something more
    profound that lies beyond the mechanisms of daily existence. The passage masterfully combines the
    ordinary with an ambience that suggests a lingering presence of the extraordinary.'
  title: The House of Souls
  year: 1906
845cfbb1c1b08f27:
  description: '"The Wendigo" by Algernon Blackwood is a novella first published in 1910. In the remote
    wilderness of Northwestern Ontario, a moose-hunting expedition takes a terrifying turn when guide
    Joseph Défago senses something monstrous stalking the woods. After a strange voice calls his name
    in the night, Défago vanishes into the forest, leaving behind inexplicable footprints that transform
    into something inhuman. What the searchers discover challenges their understanding of reality and
    introduces them to an ancient horror whispered about by North Woods lumbermen.'
  title: The Wendigo
  year: 1910
8aa8ef480c3e364f:
  description: '"Beyond the Black River" by Robert E. Howard is a short story first published in May–June
    1935. Set in the fictional Hyborian Age, it follows Conan the Cimmerian as he battles a savage Pictish
    tribe led by the wizard Zogar Sag in the unsettled wilderness beyond the Black River. When a frontier
    fort faces overwhelming assault, Conan and a young settler named Balthus must warn defenseless colonists
    before they''re slaughtered in a massive raid that threatens to reclaim an entire province.'
  title: Beyond the Black River
  year: 1935
8f1eadc3f2bab528:
  description: '"A Warning to the Curious, and Other Ghost Stories" by M. R. James is a collection of
    supernatural short stories written in the early 20th century. This anthology follows various protagonists
    destined to confront eerie and unsettling events related to antiquities and the past, as they encounter
    remnants of histories that refuse to fade quietly into obscurity.  The opening of the collection presents
    the story "The Haunted Doll’s House." It introduces Mr. Dillet, a collector who acquires an ornate
    dollhouse with a mysterious past. Upon bringing it home, he experiences a supernatural phenomenon
    that merges his reality with unsettling, ghostly visions of the dollhouse''s previous inhabitants.
    As he unravels the history connected to the house, the narrative unfolds layers of horror and tension
    that hints at dark secrets and unresolved tales, setting the tone for the chilling ghost stories to
    follow in this intriguing anthology.'
  title: A Warning to the Curious, and Other Ghost Stories
  year: 1925
8f7af24040b8f972:
  description: '"The Five Jars" by M. R. James is a fantasy novel written in the early 20th century. The
    story follows an unnamed protagonist who embarks on an unusual adventure involving magical elements,
    a mysterious box containing jars with supernatural properties, and a journey into a world populated
    by small people and fantastical creatures. The novel is steeped in a whimsical tone, rich descriptions
    of nature, and an exploration of the consequences of tampering with magic.  The opening of the book
    presents a detailed account of the protagonist''s mystical experience in a remote wood. After falling
    asleep by a stream, he dreams of a peculiar plant, which he later finds and collects. This discovery
    leads him to a round pool of water, where he interacts with the spring and gathers valuable silver.
    As he delves deeper into his adventure, he uncovers a buried box containing five jars, each inscribed
    with Latin phrases that suggest they hold extraordinary powers. The opening sets an enchanting atmosphere,
    introducing readers to the protagonist''s curiosity and the magical world that awaits him, paving
    the way for a tale of discovery and wonder.'
  title: The Five Jars
  year: 1922
91c1fa18e1001fd6:
  description: '"The Hyborian Age" by Robert E. Howard is an essay written in the 1930s that maps the
    fictional prehistory underlying his Conan the Cimmerian stories. Created to maintain consistency across
    his tales, Howard''s detailed chronicle traces cataclysmic events, the rise and fall of ancient civilizations,
    and the racial origins of his invented nations. This ambitious world-building exercise links his Kull
    and Conan narratives into a shared universe, borrowing liberally from actual history and myth to craft
    a sprawling prehistoric saga that spans thousands of imagined years.'
  title: The Hyborian Age
  year: 1936
9712d7e2c8553aed:
  description: '"Day and Night Stories" by Algernon Blackwood is a collection of short stories written
    in the early 20th century. The book explores the complexities of human emotions and relationships,
    often delving into themes of love, memory, and the supernatural. Each story is set against a backdrop
    that reflects both the beauty and the mystery of life, drawing readers into a world where the everyday
    intersects with the extraordinary.  The opening of the first story, "The Tryst," introduces a man
    who is returning to a familiar place after fifteen years away, filled with anticipation and nostalgia
    for a past love. As he makes his way back to the garden gate where he once promised to meet her, he
    wrestles with his emotions and memories of their youthful romance. This initial chapter sets the stage
    for a poignant exploration of longing and the passage of time, as the protagonist reflects on both
    the changes in himself and the love he so fiercely holds onto, only to face an unexpected and chilling
    revelation at the end of his journey.'
  title: Day and Night Stories
  year: 1917
97299e139fb212e6:
  description: '"Black Canaan" by Robert E. Howard is a short story published in 1936. Set in the backwoods
    of the American South, it follows Kirby Buckner as he returns home after receiving a cryptic warning.
    He discovers his homeland threatened by a mysterious conjure man named Saul Stark, who plans to lead
    an uprising. Buckner encounters a bewitching quadroon woman whose supernatural powers hold him captive,
    drawing him toward a terrifying voodoo ceremony where dark magic and deadly rituals await in the swamps
    of Canaan.'
  title: Black Canaan
  year: 1936
988e051802bf15da:
  description: '"The Fearsome Touch of Death" by Robert E. Howard is a horror short story written in the
    early 20th century, likely during the 1920s. The narrative explores themes of fear, death, and the
    psychological impact of solitude on the human mind. It delves into a man''s experience as he confronts
    the corpse of a reclusive old man during a night watch, wrestling with his own fears and the eerie
    atmosphere that surrounds him.  The story centers around Falred, who is tasked with sitting up with
    the body of the recently deceased Adam Farrel. As the night progresses, Falred''s imagination takes
    over, and he becomes increasingly unnerved by the silent, oppressive darkness and the lifeless form
    before him. After falling asleep, he awakens in a terror-filled haze, convinced that Farrel has somehow
    risen from the dead. The tension escalates as Falred grapples with his horror and disbelief, ultimately
    leading to a tragic and ironic conclusion when he succumbs to his own fear, mistaking his own hand
    for the dead man’s. The story captures the primal fear of death and the unknown, underscored by the
    chilling twist at the end.'
  title: The Fearsome Touch of Death
  year: 1930
9e36970796ea87d7:
  description: '"The Extra Day" by Algernon Blackwood is a novel written in the early 20th century, specifically
    in the late 1910s. This story revolves around three children, Judy, Tim, and Maria, who navigate their
    lives under the care of their family and a cast of intriguing characters, including their whimsical
    Uncle Felix. The book explores themes of wonder and imagination, as the children yearn for fantastic
    adventures and the arrival of a mysterious "Wonderful Stranger" who they believe will add excitement
    to their ordinary lives.  At the start of the narrative, we are introduced to the everyday household
    dynamics of the children, their affectionate but conventional parents, and Aunt Emily, who represents
    authority and caution. The children delight in their imaginative games and experiences within the
    confines of their familial roles but are also deeply connected to the enchanting world outside their
    home. As they anticipate the arrival of something magical to break the monotony of their lives, we
    witness glimpses of their desires and individual personalities. The chapter invites us into their
    innocent yet profound musings about life, inviting readers to reflect on their own experiences of
    wonder and the unquenchable curiosity that comes with childhood.'
  title: The Extra Day
  year: 1915
a388d3b6114f0db5:
  description: '"Queen of the Black Coast" by Robert E. Howard is a short story first published in May
    1934. Set in the fictional Hyborian Age, this Conan tale follows the Cimmerian warrior as he becomes
    a pirate alongside Bêlit, the fierce Queen of the Black Coast. Together they plunder coastal villages
    and raid merchant ships, forging a legendary partnership built on both violence and romance. When
    they venture up a mysterious river and discover ancient ruins filled with treasure, they encounter
    supernatural horrors that will test Bêlit''s promise that not even death could separate them.'
  title: Queen of the Black Coast
  year: 1934
a43c0c1b77c39433:
  description: '"The Great God Pan" by Arthur Machen is a horror and fantasy novella published in 1894.
    A dangerous experiment opens a young woman''s mind to see the supernatural god Pan, with devastating
    consequences. Years later, mysterious deaths and suicides follow the beautiful but sinister Helen
    Vaughan wherever she appears. As investigators piece together her dark origins and unnatural powers,
    they uncover a terrifying truth linking her to the ancient pagan deity and the failed experiment that
    began it all.'
  title: The Great God Pan
  year: 1894
a83e485ffca17fa5:
  description: '"Four Weird Tales" by Algernon Blackwood is a collection of short stories written in the
    early 20th century. The tales delve into the mysterious and the supernatural, showcasing Blackwood''s
    gift for atmospheric storytelling and deep philosophical insights. One of the standout narratives
    is "The Insanity of Jones," which centers on a man named John Enderby Jones, who grapples with the
    concepts of reincarnation and the consequences of past lives as he navigates his mundane job and an
    intense internal quest for justice.  The opening of "The Insanity of Jones" introduces us to the protagonist,
    John Jones, a man who perceives his everyday existence as a façade, believing his true self exists
    on a higher plane of consciousness. Jones is haunted by an overwhelming sense of purpose tied to his
    numerous past lives, and as he goes about his responsibilities in a fire insurance office, he becomes
    fixated on another man—his Manager—whom he feels he has a deep-seated account to settle, stemming
    from previous incarnations. As he contemplates his connection to this man and prepares for a climactic
    confrontation with the consequences of their intertwined pasts, Jones''s dreams and waking moments
    begin to blur the line between reality and the spiritual realm he believes in, setting the stage for
    a haunting and inevitable reckoning.'
  title: Four Weird Tales
  year: 1912
a8c55689dac79205:
  description: '"The Dream Snake" by Robert E. Howard is a short story published in the late 1920s. This
    eerie tale features elements of horror and psychological suspense, exploring the realm of nightmares
    and the fear of the unknown. The story delves into the psychological experiences of the protagonist
    as he recounts an extremely vivid and haunting recurring dream that blurs the line between reality
    and imagination.  In the narrative, a man named Faming shares a horrifying dream about living in a
    solitary bungalow on a hill in Africa, where he feels a constant dread of being pursued by a monstrous
    serpent. As he describes the dream, Faming experiences intense fear and an overwhelming sense of impending
    doom, especially as he senses the serpent drawing nearer with each repetition of the dream. The story
    paints a vivid picture of his terror as he waits in the bungalow, grappling with his sanity while
    paralyzed by the anticipation of the serpent''s arrival. Ultimately, the tale reaches a chilling conclusion
    with Faming''s untimely death, suggesting the devastating power of fear and the psychological impact
    of one''s nightmares becoming a horrifying reality.'
  title: The Dream Snake
  year: 1928
ab3fce629ebf3ef1:
  description: '"The Moon of Skulls" by Robert E. Howard is a fantasy adventure novella written in the
    early 20th century. It follows the grim Puritan swordsman Solomon Kane as he penetrates the lost African
    city of Negari to rescue the kidnapped heiress Marylin Taferal, clashing with the cruel queen Nakari
    and the echoing horrors of an ancient Atlantean past.


    The opening of the tale shows Kane climbing a jungle crag at night, dodging a hurled boulder, ignoring
    a corpse “signpost,” and being escorted—then betrayed—by hidden warriors at a chasm-spanning bridge.
    He falls with a foe, survives on a ledge, fights through a bat-haunted cavern and a giant serpent,
    and discovers man-built secret corridors within a vast, ancient palace. Spying on the throne room,
    he witnesses Nakari’s ruthless rule before slipping into a private chamber where he finds Marylin;
    she recounts her abduction and his long pursuit across seas and continents. Caught by Nakari, Kane
    is trapped and chained, rejects her offer to rule the world at her side, then escapes via a hidden
    door and meets a dying Atlantean priest who reveals Negari’s origin, its worship of the skull of Nakura,
    and the coming “Moon of Skulls” sacrifice. Racing to stop it, Kane reaches the wrong stair but improvises:
    he kills a guard, regains his pistol, shatters Nakura’s skull with a shot, and plunges the city into
    homicidal madness; Nakari dies in the chaos, Kane smashes the masked sacrificer, frees Marylin, and
    faces a final onrushing attacker as the scene cuts off.'
  title: The Moon of Skulls
  year: 1930
ac517322217a6cb4:
  description: '"Time and the Gods" by Lord Dunsany is a collection of short stories published in 1906.
    The book presents tales linked by Dunsany''s invented pantheon of deities dwelling in the mystical
    realm of Pegāna. This second work by the Irish fantasy writer explores cosmic themes through imaginative
    mythology, featuring gods, mortals, and their intertwined fates. The collection influenced major fantasy
    authors including Tolkien and Lovecraft, and was originally illustrated by Sidney Sime with ten haunting
    black and white drawings that still reside at Dunsany Castle.'
  title: Time and the Gods
  year: 1906
af09cbb09814bcd5:
  title: Crowd-Horror
  year: 1929
af472184199f622c:
  description: '"Carnacki, the Ghost Finder" by William Hope Hodgson is a collection of short stories
    published between 1910 and 1913. The work features Thomas Carnacki, an occult detective who investigates
    unusual hauntings using scientific methods, photography, and his fictional invention, the Electric
    Pentacle. Inspired by Sherlock Holmes, each story follows Carnacki as he recounts his latest case
    to close friends. The twist: some hauntings prove genuinely supernatural, while others are merely
    human fakery—keeping readers guessing throughout.'
  title: Carnacki, the Ghost-Finder
  year: 1913
b129e31dd29a2bc0:
  description: '"Plays of Gods and Men" by Lord Dunsany is a collection of dramatic works written in the
    early 20th century. The text presents a blend of myth and philosophy, exploring themes surrounding
    divinity, nature, and the human condition. In particular, the opening features characters trapped
    in the tension between the divine and the mundane, highlighting the struggles of kings, queens, and
    commoners alike in understanding their destinies in the face of capricious gods.  At the start of
    "Plays of Gods and Men," the initial play, "The Laughter of the Gods," introduces a vibrant but precarious
    setting in the jungle city of Thek. The narrative centers around King Karnos and his court, as his
    advisors express concern over the city''s health and the ominous prophecies hinted at by a mysterious
    prophet. The characters engage in a mix of personal desires and political machinations, with discussions
    revealing their existential dread as they grapple with the foreboding presence of the gods. The unfolding
    dialogue sets the stage for a deeper exploration of fate, free will, and the often absurdity of life
    through the lens of both divine wrath and human folly.'
  title: Plays of Gods and Men
  year: 1917
b1a584f2b55aefa6:
  description: '"Far Off Things" by Arthur Machen is a reflective memoir written in the early 20th century.
    The work delves into Machen''s personal experiences and memories, primarily focusing on his upbringing
    in Wales, exploring themes of nostalgia, the passage of time, and the impact of place on the imagination.   The
    opening of the memoir sets the stage for Machen’s contemplations as he recalls a convivial evening
    among a literary society, which triggers memories of his youthful days spent in the serene countryside
    of Gwent, Wales. He vividly describes the juxtaposition of the vibrant life in London, contrasted
    with the tranquil, enchanted landscapes of his childhood, hinting at how these early impressions have
    profoundly influenced his literary endeavors. As the narrative unfolds, it becomes clear that Machen
    cherishes the beauty of his rural roots and the rich tapestry of his experiences, entwined with both
    the joys and challenges that shaped his life as a writer.'
  title: Far Off Things
  year: 1922
b20d528ab5f62437:
  description: '"The Great Return" by Arthur Machen is a supernatural novella written in the early 20th
    century, specifically during the 1910s. This mystical narrative explores themes of spiritual awakening
    and extraordinary occurrences in the small Welsh town of Llantrisant. Through a blend of folklore
    and the mysterious, Machen illustrates a world where the boundary between the ordinary and the divine
    blurs, inviting readers to ponder existential questions about faith, beauty, and the nature of reality.  The
    story centers around a series of miraculous events that unfold in Llantrisant during a time of war,
    starting from the curious ringing of a bell heard by a deaf old woman, which heralds a profound transformation
    in the town''s inhabitants. As various characters experience anomalies—including a young girl’s miraculous
    recovery from tuberculosis and a lawyer''s humbling reconciliation with a farmer—Machen weaves together
    elements of the fantastical and the sublime. The narrative culminates in a transcendent church service
    where the aroma of paradise fills the air, leading to a collective renewal of spirit among the townsfolk.
    Ultimately, "The Great Return" serves as an exploration of the mysteries of existence, suggesting
    that the divine can manifest in the most unexpected ways, resonating deeply with the themes of hope
    and redemption during tumultuous times.'
  title: The Great Return
  year: 1915
b48952cad45f6260:
  description: '"The Works of Edgar Allan Poe — Volume 3" by Edgar Allan Poe is a collection of narratives
    and short stories likely compiled during the mid-19th century. This volume includes significant works
    such as "Narrative of A. Gordon Pym," which introduces the titular character whose adventures at sea
    encompass themes of exploration, danger, and survival. The narrative intertwines fictional elements
    with the real-life experiences of its characters, inviting readers into a richly imaginative and suspenseful
    world.  The beginning of this volume presents an introductory note by Arthur Gordon Pym detailing
    his extraordinary adventures in the South Seas, which prompted him to share his story. Pym recounts
    his upbringing and relationships, particularly with his friend Augustus Barnard, which sets the stage
    for their eventual ill-fated expedition at sea. Their reckless decision to sail out on a cold night
    leads to chaos when Barnard descends into intoxication, leaving Pym to manage their dangerously unsound
    vessel alone. The opening climaxes with a dramatic encounter that highlights the perils of their venture,
    ending with Pym''s miraculous rescue after a harrowing sequence of events, laying the groundwork for
    further adventures to come.'
  title: The Works of Edgar Allan Poe, Volume 3
  year: 1903
b4a040d80678af31:
  description: '"Ghost Stories of an Antiquary" by M. R. James is a collection of ghost stories published
    in 1904. This landmark volume contains eight tales of supernatural terror, including the famous "''Oh,
    Whistle, and I''ll Come to You, My Lad''" and "Count Magnus." James'' stories blend scholarly settings
    with creeping dread, establishing a distinctive style that would define literary ghost fiction. The
    collection features illustrations by James McBryde, created shortly before his untimely death. These
    atmospheric tales have been widely adapted for television and continue to influence the ghost story
    tradition.'
  title: Ghost Stories of an Antiquary
  year: 1904
b69a23e2308cfc41:
  description: '"The Willows" by Algernon Blackwood is a novella published in 1907. Two friends on a canoe
    trip down the Danube land on an isolated island where they encounter mysterious supernatural forces
    emerging from the surrounding wilderness. As strange shapes rise from the willow trees and inexplicable
    phenomena intensify, the men realize they may have crossed into another dimension—a hostile realm
    where unseen entities demand sacrifice. H.P. Lovecraft called it the finest supernatural tale in English
    literature.'
  title: The Willows
  year: 1907
b805f4741a5d7fa6:
  description: '"Shadows in the Moonlight" by Robert E. Howard is a short story first published in April
    1934. This sword and sorcery tale follows Conan the Cimmerian as he flees with a woman named Olivia
    to a mysterious island in the Vilayet Sea. There they encounter ancient ruins with lifelike statues,
    a lurking creature hurling boulders, and a crew of pirates. As night falls, Olivia''s disturbing dream
    about the statues may prove prophetic, threatening everyone on the cursed island.'
  title: Shadows in the Moonlight
  year: 1934
b93ddf8f8ffce05a:
  description: '"Karma: A Re-incarnation Play" by Algernon Blackwood and V. A. Pearn is a play published
    in 1918. A couple''s love spans multiple lifetimes, from Ancient Egypt through Greece and Renaissance
    Italy to wartime London. In each era, duty conflicts with devotion. When illness strikes the wife
    in 1918, a psychical doctor uses past-life regression to unlock the karmic patterns binding them.
    This spiritual romance blends Blackwood''s mystical beliefs with wartime themes, exploring whether
    eternal love can finally break free from its cycle.'
  title: 'Karma: A Reincarnation Play'
  year: 1918
bcb278cbc8daea8c:
  description: '"The Human Chord" by Algernon Blackwood is a novel written during the early 20th century
    that delves into the mystical relationships between sound, names, and the human experience. The story
    centers around the protagonist, Robert Spinrobin, whose vivid imagination and childhood belief in
    the power of names shape his journey into a world of spiritual adventure. As he grows older, he seeks
    an extraordinary existence beyond the mundane, ultimately leading him to a retired clergyman named
    Philip Skale, who has intriguing plans for experiments involving sound and spiritual truths.  At the
    start of the narrative, readers are introduced to Spinrobin''s imaginative childhood, where he perceives
    names as vital forces that bring creations to life. We learn of his later discontent with ordinary
    life, prompting him to answer an unusual job advertisement by Skale, who requires a secretary with
    unique qualities. The opening portion establishes Spinrobin’s character as whimsical yet yearning
    for depth, setting the stage for his encounter with Skale, who embodies both a grounding force and
    a visionary leader. As Spinrobin embarks on this unique assignment, he begins to experience profound
    connections with sound, language, and a mysterious young woman named Miriam, hinting at the deeper
    spiritual explorations yet to unfold in their intertwined destinies.'
  title: The Human Chord
  year: 1910
bd6b6995e9fe2163:
  description: '"A Prisoner in Fairyland" by Algernon Blackwood is a novel written in the early 20th century,
    around 1913. The story intricately weaves the life of its protagonist, Henry Rogers, as he transitions
    from the world of rigid business responsibilities into one filled with the whimsical and nostalgic
    splendor of childhood imagination. The journey promises a blend of fantasy and self-discovery, hinting
    at Rogers’ longing for a more meaningful, magical existence that rekindles the innocence and joy of
    his youth.  The opening of the novel introduces us to Herbert Montmorency Minks, the dedicated and
    somewhat melancholic secretary to the ambitious business tycoon Henry Rogers. Minks harbors a deep
    admiration for Rogers and is on the verge of a career breakthrough. The narrative sets the stage for
    a profound exploration of themes such as ambition and unfulfilled dreams, as Minks reflects on his
    own artistic aspirations and the bond he shares with his employer. As Minks revels in his newfound
    position, we see hints of a larger journey for both him and Rogers, one steeped in nostalgia, creativity,
    and the exploration of what it means to reconnect with one’s inner child and imagination. The narrative
    artfully contrasts the mundane aspects of their lives with the enchanting allure of dreams and poetry,
    suggesting that there are greater adventures awaiting both men just beyond the confines of their contemporary
    existence.'
  title: A Prisoner in Fairyland (The Book That 'Uncle Paul' Wrote)
  year: 1913
bdb51007cd63a54b:
  description: '"The House on the Borderland" by William Hope Hodgson is a supernatural horror novel published
    in 1908. A recluse living in an ancient, circular house in remote Ireland records his terrifying experiences
    in a journal later discovered by two fishermen. He encounters monstrous Swine-creatures emerging from
    a mysterious pit, experiences visions of cosmic dimensions and otherworldly arenas, and witnesses
    time itself accelerating toward the end of the universe. This hallucinatory tale influenced H. P.
    Lovecraft and pioneered modern cosmic horror.'
  title: The House on the Borderland
  year: 1908
be9d1166e540bdb4:
  description: '"The Mirrors of Tuzun Thune" by Robert E. Howard is a fantasy short story published in
    1929. King Kull of Valusia, plagued by existential despair, seeks answers from Tuzun Thune, a mysterious
    wizard who shows him an enchanted mirror. As Kull returns day after day to gaze at his reflection,
    he becomes obsessed with the world within the glass, neglecting his kingdom. But the mirror may hold
    more than philosophical truth—it might be part of a deadly conspiracy that threatens reality itself.'
  title: The Mirrors of Tuzun Thune
  year: 1929
beada6c86e8c6db9:
  description: '"The Hour of the Dragon" by Robert E. Howard is a fantasy novel first published serially
    from December 1935 to April 1936. King Conan of Aquilonia faces his greatest challenge when conspirators
    resurrect an ancient sorcerer to overthrow him. Defeated, captured, and freed by a brave slave girl,
    Conan must undertake a perilous quest across the Hyborian Age to reclaim his throne. This sword and
    sorcery epic combines necromancy, foreign occupation, and adventure in Howard''s only full-length
    Conan novel.'
  title: The Hour of the Dragon
  year: 1935
c0d3e41e998a682d:
  description: '"The Promise of Air" by Algernon Blackwood is a novel written in the early 20th century.
    The story centers on Joseph Wimble, the only son of an analytical chemist, who is characterized by
    his placid nature and indifferent attitude toward life''s expectations. Initially groomed for a successful
    societal role, Wimble''s life takes a turn when he marries against his father''s wishes, ultimately
    leading him on a path towards a deeper connection with the natural world, particularly the mysteries
    of bird life and the promise of air.  At the start of the novel, we are introduced to Joseph Wimble
    and his ambitions, influenced mainly by his father, who desires for him a suitable marriage and a
    gentleman''s life. However, after secretly marrying the daughter of a corn-chandler, Joseph finds
    himself financially constrained yet emotionally fulfilled. His persistent fascination with birds symbolizes
    a longing for freedom and a connection to the air, representing a desire for transcendence beyond
    societal norms. As the narrative unfolds, Wimble''s relationship with his wife, Joan, is explored
    against the backdrop of his yearning for an airy existence, highlighting themes of love, naturalism,
    and the pursuit of happiness through personal expression.'
  title: The Promise of Air
  year: 1918
c1b30736331989c9:
  description: '"The Ghost Pirates" by William Hope Hodgson is a horror novel published in 1909. Told
    as the testimony of Jessop, sole survivor of the doomed ship Mortzestus, the story chronicles strange
    events that escalate in frequency and terror. Mysterious beings—never clearly described—gradually
    commandeer the vessel as the crew struggles between disbelief and mounting dread. Hodgson leaves their
    true nature ambiguous, suggesting they may be ghosts or entities from another dimension that has breached
    into our world, though their origin and purpose remain unexplained.'
  title: The Ghost Pirates
  year: 1909
c66f9f866239d1d6:
  description: '"Gods of the North" by Robert E. Howard is a short story that was published in the early
    20th century, specifically in the 1930s. This story centers around themes of myth, battle, and enchanting
    encounters, likely exploring the mystical elements of Norse mythology.   The narrative follows Amra
    of Akbitana, a warrior who finds himself alone on a bloodied snowfield after a fierce battle. As he
    grapples with fatigue and disorientation, he encounters a beautiful and beguiling woman who draws
    him in with her enchanting presence, leading him away into the snowy wilderness. As Amra pursues her,
    he must contend with giants and the underlying threat of death. Ultimately, he realizes he has been
    lured by Atali, the frost-giant’s daughter, a figure who leads warriors to their doom. The story combines
    elements of fantasy with the brutal reality of warfare, culminating in a haunting exploration of temptation
    and mortality.'
  title: Gods of the North
  year: 1934
c734612965ce1dca:
  description: '"The Fire of Asshurbanipal" by Robert E. Howard is a posthumous weird tale, which likely
    reflects the author''s work during the early 20th century. This short story revolves around an adventurous
    quest set in the mythic landscape of ancient Persia, involving treasure seekers caught in a web of
    danger, mystery, and supernatural elements. It blends adventure with horror, steeped in the richness
    of folklore and history regarding a fabled city and a cursed gem.  The narrative follows two main
    characters, Steve Clarney and the Afghan warrior Yar Ali, as they venture into the desolate desert
    in search of the legendary "Fire of Asshurbanipal," a mysterious gem said to be guarded by a horrific
    evil. Their journey leads them to the lost city of Kara-Shehr, where they stumble upon a skeletal
    figure grasping the pulsating gem. However, as they attempt to claim the treasure, they awaken an
    ancient curse associated with the stone and the city. The story escalates into a gripping confrontation
    with both human foes and nightmarish supernatural forces, culminating in an unnerving revelation about
    the true nature of the gem and the beings that guard it. Howard’s storytelling is characterized by
    thrilling action and vivid imagery, leaving readers with a haunting sense of the supernatural that
    lingers long after the tale concludes.'
  title: The Fire of Asshurbanipal
  year: 1936
c99db3bb16525c52:
  description: '"Julius LeVallon: An Episode" by Algernon Blackwood is a novel written in the early 20th
    century. The book explores themes of memory, reincarnation, and metaphysical connections through the
    relationship between the main characters, John Mason and Julius LeVallon, who appear to share a deep
    and mysterious bond that transcends their current lives. As their friendship develops, they navigate
    the complexities of memory, identity, and the essence of existence.  At the start of the story, we
    are introduced to John Mason, who reflects on his time as a schoolboy in the late 1890s, awaiting
    letters in Bâle after a climbing holiday. He receives a message from Julius LeVallon, a former friend
    who evokes strong memories and emotions in him. The narrative delves into their past connection, marked
    by vibrant shared experiences and recollections of previous lives. Mason’s first impressions of LeVallon
    reveal him to be an unusual, ethereal figure, stirring feelings of admiration and curiosity within
    Mason. Their dialogue hints at the possibility of shared memories from previous incarnations and sets
    the stage for a deeper exploration of their intertwining destinies.'
  title: 'Julius LeVallon: An Episode'
  year: 1916
ce285d7de55fb9ba:
  description: '"The Terror: A Mystery" by Arthur Machen is a novel written in the early 20th century.
    The story unfolds against the backdrop of World War I, focusing on a mysterious series of terrifying
    events that plague a rural district in Wales. The narrative introduces themes of fear, paranoia, and
    the unknown, as local inhabitants grapple with unexplainable disappearances and deaths, suggesting
    a sinister force at play.  The opening of the novel sets the stage by reflecting on the atmosphere
    of World War I, evoking a sense of dread and anticipation among the populace. Machen establishes a
    connection between the war and the inexplicable horrors that begin to child the small community of
    Meirion. As the protagonist becomes drawn to the deaths related to a lost child and a series of other
    strange occurrences, he hints at eerie phenomena involving seemingly ordinary events turned deadly,
    thereby creating a chilling sense of foreboding. The reader is introduced to a land overshadowed by
    terror, with curious hints that the events are tied not just to the war''s brutality but perhaps to
    something even darker lurking in the shadows of society.'
  title: 'The Terror: A Mystery'
  year: 1917
d7694d85e0517501:
  description: '"The Three Impostors; or, The Transmutations" by Arthur Machen is an episodic horror novel
    published in 1895. Three mysterious figures roam London''s streets, spinning strange tales as they
    hunt for a missing Roman coin linked to an ancient imperial debauchery. Their web of deception conceals
    a darker purpose: tracking down "the young man with spectacles." The interconnected stories build
    toward a shocking revelation involving a secret society and debauched pagan rituals, showcasing Machen''s
    pioneering approach to supernatural terror that would later influence H. P. Lovecraft.'
  title: The Three Impostors; or, The Transmutations
  year: 1895
e06ecaeda7c93b35:
  description: '"If: A Play in Four Acts" by Lord Dunsany is a dramatic play written in the early 20th
    century. The play delves into themes of choice, consequence, and the nature of reality through its
    exploration of time and fate. The primary character, John Beal, is presented with a crystal that possesses
    the power to let him revisit his past and potentially alter decisions, leading to introspective conflicts
    about his life and relationships.  At the start of the play, we are introduced to John Beal and his
    wife, Mary, who reside in a modest suburban home. The narrative opens at a small railway station where
    John is prevented from boarding a train due to a railway worker named Bill, leading to John''s frustration
    and unresolved feelings about an important missed opportunity. The scene shifts to John’s home, where
    he reflects on this event and interacts with Mary, discussing mundane matters that reveal their domestic
    life. A significant twist occurs when John encounters Ali, who gifts him the mystical crystal, presenting
    the possibility of altering his past—specifically, his decision to catch a train a decade earlier.
    This sets the stage for John''s inner turmoil and the consequences of his choices, as Mary warns him
    against tampering with the past, highlighting the play''s central theme of wrestling with the allure
    of making different choices.'
  title: 'If: A Play in Four Acts'
  year: 1921
e9087de6204e3828:
  description: '"The King in Yellow" by Robert W. Chambers is a collection of short stories published
    in 1895. The book opens with supernatural horror tales connected by a forbidden play that drives readers
    to madness. A mysterious entity called the King in Yellow, an eerie Yellow Sign, and the cursed play
    itself haunt the first four stories, set in a future 1920s America and Paris. The collection gradually
    shifts tone, ending with romantic tales, but the opening horror stories have earned acclaim as classics
    of weird fiction.'
  title: The King in Yellow
  year: 1895
ea66573a8d6dbf41:
  description: '"Three More John Silence Stories" by Algernon Blackwood is a collection of supernatural
    tales written during the early 20th century. The narratives focus on the character John Silence, a
    physician with a deep understanding of the occult and metaphysical realms, as he tackles cases filled
    with supernatural mysteries and psychological intrigue. These stories explore themes of spirituality,
    foreboding events, and the intersection between the human mind and darker forces, which promise to
    engage readers interested in psychological horror and the paranormal.  The opening portion of "Secret
    Worship," the first case in the collection, introduces Harris, a silk merchant who takes an unexpected
    trip to revisit his old school in South Germany. As he journeys through the mountains, he reflects
    on his past experiences in a strict religious school, which evokes old memories and emotions, both
    nostalgic and unsettling. Upon arriving at the inn, he meets a Catholic priest who hints at a sinister
    past connected to the school. This initial setup hints at underlying tensions between faith and something
    darker, as the priest’s demeanor suggests that the former school is not what it seems. Harris’s recollection
    of his boyhood, alongside the ominous suggestion from the priest, sets the stage for escalating supernatural
    occurrences, leaving readers with a sense of foreboding about the mysteries that lie ahead.'
  title: Three More John Silence Stories
  year: 1908
ebe2d9629041ea8b:
  description: '"The Wave: An Egyptian Aftermath" by Algernon Blackwood is a novel written in the early
    20th century. The story revolves around a young boy named Tommy, who is haunted throughout his childhood
    by a recurring nightmare involving a massive wave that never crashes, leaving him in a state of anxiety
    and curiosity. As Tommy grows, the wave becomes symbolic of his deeper emotional experiences, touching
    on themes of love, pain, and the inevitability of facing one''s fears.  The opening of this book introduces
    readers to Tommy''s childhood nightmare, which involves a menacing wave that rises but never falls,
    symbolizing his internal struggles and premonitions. Initially, this wave is associated with dread
    and curiosity, but it evolves as Tommy encounters life experiences and emotions, including love and
    longing for a girl named Lettice Aylmer. As he grows older, the dream and its accompanying sensations—faint
    scents and the appearance of eyes—continue to resonate within him, reflecting his search for understanding
    and meaning in life. The narrative sets the stage for Tommy''s journey of self-discovery, highlighting
    the interconnections between dreams, memories, and personal growth.'
  title: 'The Wave: An Egyptian Aftermath'
  year: 1916
f03d5c59cbbb7b2f:
  description: '"The Angels of Mons: The Bowmen and Other Legends of the War" by Arthur Machen is a collection
    of short stories written during the early 20th century, specifically in 1915, amidst the backdrop
    of World War I. The collection primarily reflects on themes of spirituality and legend in the context
    of war, notably surrounding the fabled intervention of supernatural beings in battle, exploring the
    intersection of human experience and the mystical.   The book comprises several interconnected tales,
    with "The Bowmen" being the most prominent. It narrates a tense moment during the British retreat
    at Mons, where British soldiers, facing overwhelming odds, purportedly receive aid from the ghostly
    figures of long-dead archers, led by St. George. Inspired by a soldier''s invocation for divine assistance,
    these spectral bowmen unleash a hail of arrows upon the advancing Germans, turning the tide of battle.
    The other stories in the collection evoke similar themes of transcendence and the interplay between
    reality and myth, capturing the psychological state of those ensnared in war. Overall, Machen''s work
    reflects on the collective human desire for hope and divine intervention amid the horrors of conflict,
    showcasing how legends can take root even in the direst situations.'
  title: 'The Angels of Mons: The Bowmen and Other Legends of the War'
  year: 1915
f6aa0d20a5af554c:
  description: '"The Boats of the ''Glen Carrig''" by William Hope Hodgson is a horror novel published
    in 1907. Written in archaic style as a firsthand account from 1757, it follows survivors of a shipwreck
    who escape in two lifeboats. Their desperate journey takes them through nightmarish landscapes: muddy
    shores haunted by strange cries, abandoned vessels harboring deadly secrets, and blood-draining creatures
    lurking in darkness. Stranded on mysterious islands amid a vast Sargasso Sea, the men face monstrous
    threats while struggling to repair their damaged boat and survive.'
  title: The Boats of the Glen Carrig
  year: 1907
f6b633ec3bdcf5c7:
  description: '"Sea Curse" by Robert E. Howard is a short story written in the early 20th century, specifically
    in the 1920s. The tale is situated in a coastal village and revolves around themes of revenge, supernatural
    curses, and the darker aspects of human nature. Through its vivid portrayal of characters and settings,
    it delves into the lives of sailors and the impact of their actions on others, particularly through
    the lens of folklore and the supernatural.  The story follows the grim tale of John Kulrek, a brutish
    sailor who mistreats the innocent girl of Moll Farrell, a woman rumored to be a witch. After Kulrek
    and his crony, Lie-lip Canool, return from sea, they encounter Moll, who curses Kulrek for the death
    of her niece. As ominous events unfold, including a ghostly galley crewed by skeletons, the narrative
    builds toward a chilling climax. The tale concludes with the return of Kulrek''s corpse to the shore,
    revealing the grim consequences of his actions and ultimately fulfilling Moll''s curse, as she relishes
    her vengeance on him. The story intertwines elements of horror with the social and moral ramifications
    of Kulrek''s disrespect for life and the sea.'
  title: Sea Curse
  year: 1928
f8823dedfd4b61d0:
  title: The Voice of El-Lil
  year: 1930
f964aa63b3a9dc64:
  description: '"The Works of Edgar Allan Poe — Volume 1" by Edgar Allan Poe is a collection of various
    literary works, likely written in the mid-19th century. This volume presents a comprehensive look
    at Poe’s contributions to the genres of horror, mystery, and poetry, showcasing his unique ability
    to navigate themes of melancholy and the supernatural. This collection includes not only the celebrated
    tales such as "The Murders in the Rue Morgue" and "The Tell-Tale Heart," but also illuminating prefaces
    and analyses of his life and works, inviting readers to delve into the mind of one of America''s most
    iconic writers.  The beginning of this volume contains a preface, touching upon Poe''s life, struggles,
    and literary achievements, and it sets the tone for the exploration of his works. Notably, it includes
    reflections on his early life, detailing his adoption by John Allan, his education, and his tumultuous
    relationships, as well as mentions of his formative experiences and the challenges he faced in his
    literary career. The opening gives readers insight into the origins of works that blend the macabre
    with the poetic, suggesting that Poe''s life experiences deeply influenced his storytelling. Moreover,
    it serves as an introduction to the themes of despair, beauty, and complexity that define his body
    of work, preparing readers for the profound explorations ahead.'
  title: The Works of Edgar Allan Poe, Volume 1
  year: 1903
fac256ee072d8604:
  description: 'The hills of the dead by Robert E. Howard is a pulp fantasy-horror short story written
    in the early 20th century. It follows the Puritan adventurer Solomon Kane as he answers the pull of
    the African interior, wielding a voodoo staff given by the sorcerer N’Longa to confront a land cursed
    by the undead.


    Kane rescues a village girl, Zunna, then fights two red‑eyed revenants in a cave, discovering that
    only fire, a broken neck, or the enchanted staff can end them. Learning the hills shelter a nation
    of walking dead rooted in an ancient stone city, he calls on N’Longa through dream-magic. N’Longa’s
    spirit enters Zunna’s lover, Kran, and guides Kane into the vampire country. Swarmed on a crag, Kane
    holds the fiends at bay until N’Longa summons vast flocks of vultures, which drive the undead into
    their city; the pair then ring it with fire, destroying the brood. Back at the cave, N’Longa restores
    Kran and Zunna, explains the staff’s power, and departs, while Kane, scarred but resolute, turns again
    toward the beckoning wilds.'
  title: The Hills of the Dead
  year: 1930
fca473126b3dd011:
  description: '"The Grisly Horror" by Robert E. Howard is a gripping tale of horror and heroism, presented
    as a short fiction piece that likely emerged in the early 20th century, specifically during the 1930s.
    The story unfolds in the dark, oppressive landscapes of the Mississippi swamps, centering around themes
    of ancient curses, grotesque entities, and the primal terror woven into the very fabric of the land.
    The narrative dives deep into the dark secrets of a family, the Ballvilles, and portrays the struggle
    between forces of evil and the resilient spirit of the protagonist.  The plot follows Bristol McGrath,
    a man drawn back to his ancestral homeland by a telegram claiming the love of his life, Constance
    Brand, still lives. As he ventures into the haunted territory of the Ballville estate, he encounters
    horrific sights, including the tortured remnants of Richard Ballville, Constance’s captor. McGrath’s
    quest leads him to uncover the nefarious plans of John De Albor, a man connected to an ancient cult
    worshiping a deadly entity, Zemba, a horrific creature reminiscent of a monstrous ape. The story crescendos
    into a frantic race against time as McGrath fights not only for Constance''s safety but also battles
    the dark forces tied to the cursed history of the region, leading to a climactic confrontation against
    both De Albor and the monstrous Zemba. Ultimately, it encapsulates themes of love, vengeance, and
    the savage horrors that lie just beneath the surface of civilization.'
  title: The Grisly Horror
  year: 1935
fe1e46bf5552bff3:
  description: '"Five Plays" by Lord Dunsany is a collection of dramatic works written in the early 20th
    century. This compilation features five plays, including "The Gods of the Mountain" and "The Golden
    Doom," showcasing Dunsany''s rich use of fantasy, mythology, and poetic language. The plays explore
    themes of divinity, fate, and the human condition, often through the interactions of various characters
    caught between their desires and the forces that control their lives.  The beginning of this collection
    introduces "The Gods of the Mountain," where a group of beggars, disillusioned by the misery of their
    city, discuss the decline of generosity and divine inspiration. As they lament the drowsy gods who
    fail to inspire the rich, a figure named Agmar appears, claiming to be a beggar but hinting at a grander
    scheme. The scene is infused with a sense of both hope and trepidation as Agmar suggests that they
    disguise themselves as gods to reclaim their dignity and perhaps influence the fortunes of the city.
    This opening sets the stage for Dunsany''s thematic exploration of identity, societal roles, and the
    interplay between mortals and the divine.'
  title: Five Plays
  year: 1914
fe6a813a7bf220e5:
  description: 'Things near & far by Arthur Machen is a memoir written in the early 20th century. It blends
    luminous recollections of his Welsh childhood and family with frank accounts of his literary apprenticeship
    in London, digressions on occult literature and aesthetics, and wry reflections on poverty, pleasure,
    and the making of art. Expect a meandering, eloquent life-portrait in which place, reading, and wonder
    matter as much as plot.


    The opening of the memoir sets a dream-bright vision of Caerleon-on-Usk, then imagines two aunts walking
    the white road to meet the young “John” returning from Oxford, only to pivot to the sober knowledge
    that all those figures are long dead. From there it moves to the mid-1880s: the narrator wanders the
    lanes of Gwent, then returns to London for hack work compiling a catalogue of occult books in a Strand
    garret, sifting alchemists, Kabbalists, and spiritualists while maintaining a skeptical but curious
    mind. He struggles to begin a “Great Romance,” writes playful dedications and an epilogue to an unwritten
    book, and is abruptly called home because his mother is dying. Subsequent chapters turn into a meditation
    on why one writes despite little money and much toil, recounting the painful composition of early
    tales and the eventual completion of The Chronicle of Clemendy. The scene then shifts to a lively
    circuit of London lodgings, a comic “war” on fleas ingeniously won with flypapers, and a rapturous
    trip to Touraine—disappointment at Doré’s imagined landscapes giving way to the real delights of inns,
    wine, and Chinon. He returns to practice the “great art” of getting lost in London’s unknown quarters,
    before noting a modest inheritance that lets him live simply, avoid luxury, and keep writing for the
    pleasure—and necessity—of wonder.'
  title: Things Near and Far
  year: 1923
fefd8d70b61f5dc3:
  description: '"Red Shadows" by Robert E. Howard is a collection of pulp fiction short stories, written
    in the early 20th century during the advent of the genre. The book features Solomon Kane, an Englishman
    and an adventurer who embarks on a quest for vengeance and justice in various exotic and dangerous
    locales. The stories encapsulate themes of brutality, morality, and the supernatural, all set against
    dark and captivating backdrops reminiscent of classic adventure tales.  The narrative follows Solomon
    Kane as he confronts various villains, particularly Le Loup, a cruel bandit leader who causes terror
    and death in the regions he plunders. The plot unfolds with intense action as Kane pursues Le Loup
    after the villain''s men commit heinous acts against innocent people, culminating in a violent confrontation.
    The tension heightens as Kane navigates through treacherous jungles and encounters the supernatural,
    including resurrection and powerful ju-ju magic. Each story in this collection captures the dark,
    brooding mood characteristic of Howard''s writing, emphasizing Kane''s relentless pursuit of justice
    and the moral complexities of the world he inhabits.'
  title: Red Shadows
  year: 1928
