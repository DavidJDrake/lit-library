[project]
name = "ebook-indexer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.28.2",
    "Pillow>=12.3.0",
    "requests>=2.34.2",
    "boto3>=1.43.87",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
