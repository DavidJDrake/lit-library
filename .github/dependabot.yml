version: 2
updates:
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: weekly, day: monday }
    groups:
      infra-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /indexer
    schedule: { interval: weekly, day: monday }
    groups:
      indexer-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
