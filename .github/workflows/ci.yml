name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infra:
    name: infra (CDK + Lambdas)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The example config is the one file loadConfig() accepts without local secrets;
      # synth also proves both Lambdas bundle with esbuild.
      - run: npx cdk synth --quiet
        env:
          EBOOK_SHARE_CONFIG: config.example.json

  web:
    name: web (React SPA)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    env:
      # The build only checks that these are present; the values are never deployed from CI.
      VITE_COGNITO_DOMAIN: https://example.auth.us-east-1.amazoncognito.com
      VITE_CLIENT_ID: ci-placeholder
      VITE_API_URL: /api
      VITE_REDIRECT_URI: https://example.com/
      VITE_KINDLE_SENDER: library@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  indexer:
    name: indexer (Python)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: indexer }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q
